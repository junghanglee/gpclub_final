name: Supabase backup

on:
  schedule:
    # Every day at 03:15 KST (18:15 UTC).
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://eykgfnstfohkefzerqlf.supabase.co
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Validate backup secrets
        shell: bash
        run: |
          : "${SUPABASE_ACCESS_TOKEN:?Missing SUPABASE_ACCESS_TOKEN GitHub secret}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Missing SUPABASE_SERVICE_ROLE_KEY GitHub secret}"
          : "${BACKUP_ENCRYPTION_PASSPHRASE:?Missing BACKUP_ENCRYPTION_PASSPHRASE GitHub secret}"

      - name: Create database backup
        shell: bash
        run: |
          mkdir -p backup/database
          supabase link --project-ref eykgfnstfohkefzerqlf
          supabase db dump --linked --file backup/database/roles.sql --role-only
          supabase db dump --linked --file backup/database/schema.sql
          supabase db dump --linked --file backup/database/data.sql --data-only --use-copy

      - name: Download Storage objects
        run: node scripts/backup-supabase-storage.mjs backup/storage

      - name: Package, encrypt, and checksum backup
        shell: bash
        run: |
          timestamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          archive="gpclub-supabase-${timestamp}.tar.gz"
          tar -C backup -czf "$archive" database storage
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --output "${archive}.gpg" \
            "$archive"
          rm "$archive"
          sha256sum "${archive}.gpg" > "${archive}.gpg.sha256"
          echo "BACKUP_ARCHIVE=${archive}.gpg" >> "$GITHUB_ENV"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_ARCHIVE }}
          path: |
            ${{ env.BACKUP_ARCHIVE }}
            ${{ env.BACKUP_ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Write backup summary
        shell: bash
        run: |
          echo "### Supabase backup created" >> "$GITHUB_STEP_SUMMARY"
          echo "- Archive: \`$BACKUP_ARCHIVE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retention: 30 days" >> "$GITHUB_STEP_SUMMARY"
          echo "- Includes: PostgreSQL database, Storage objects, checksums, and manifests" >> "$GITHUB_STEP_SUMMARY"
